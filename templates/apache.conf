<VirtualHost *:@@NGINX_PORT@@>
    ServerName @@SERVER_FQDN@@
    ServerAlias @@SERVER_IP@@ localhost

    ProxyPreserveHost On
    ProxyRequests Off

    Alias /static/ @@NETBOX_DIR@@/netbox/static/
    <Directory @@NETBOX_DIR@@/netbox/static/>
        Require all granted
    </Directory>

    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:@@GUNICORN_PORT@@/
    ProxyPassReverse / http://127.0.0.1:@@GUNICORN_PORT@@/

    RequestHeader set X-Forwarded-Proto "http"

    LimitRequestBody 26214400

    ErrorLog ${APACHE_LOG_DIR}/netbox_error.log
    CustomLog ${APACHE_LOG_DIR}/netbox_access.log combined
</VirtualHost>
