#!/bin/bash
# config/defaults.conf
#
# Default settings for the NetBox installer.
# Do NOT edit this file to customize your install -- copy it instead, e.g.:
#   cp config/defaults.conf config/local.conf
#   sudo ./install.sh --config config/local.conf
#
# Any value left as CHANGE_ME will be auto-generated at install time
# if the corresponding *_AUTOGEN flag below is "true".

# ---- NetBox source ------------------------------------------------------
# Official releases: https://github.com/netbox-community/netbox/releases
# "latest" auto-detects the newest release tag from the GitHub API at
# install time. Pin to a specific tag (e.g. "v4.1.3") for reproducible installs.
NETBOX_VERSION="latest"
NETBOX_SOURCE_URL="https://github.com/netbox-community/netbox/archive/refs/tags/${NETBOX_VERSION}.tar.gz"

# ---- Filesystem / OS user -------------------------------------------------
NETBOX_DIR="/opt/netbox"
NETBOX_RUN_USER="netbox"        # dedicated system account NetBox runs as

# ---- Database -------------------------------------------------------------
NETBOX_DB="netbox"
NETBOX_USER="netbox"
NETBOX_DB_PASSWORD="CHANGE_ME"
NETBOX_DB_PASSWORD_AUTOGEN="true"   # generate a random password if CHANGE_ME

# ---- Admin account ----------------------------------------------------
ADMIN_USER="admin"
ADMIN_PASSWORD="CHANGE_ME"
ADMIN_PASSWORD_AUTOGEN="true"       # generate a random password if CHANGE_ME
ADMIN_EMAIL="admin@linuxbsh.ir"

# ---- Web server ---------------------------------------------------------
WEB_SERVER="nginx"      # nginx | apache | none (bring your own reverse proxy)
NGINX_PORT="80"
GUNICORN_PORT="8001"

# ---- Optional features -----------------------------------------------
INSTALL_LDAP="false"
MANAGE_FIREWALL="true"

# ---- Behaviour ------------------------------------------------------------
ASSUME_YES="false"     # set true (or pass -y) to skip confirmation prompts
